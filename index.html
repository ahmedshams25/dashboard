<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة التحكم الذكية | تصميم أبل الزجاجي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Apple System Design Tokens & Glassmorphism Variables */
        :root {
            --apple-blue: #007AFF;
            --apple-purple: #5856D6;
            --apple-indigo: #4B0082;
            --apple-green: #34C759;
            --apple-red: #FF3B30;
            --apple-orange: #FF9500;
            
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-hover: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-border-dark: rgba(0, 0, 0, 0.08);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
            --glass-blur: blur(25px) saturate(190%);
            
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --sidebar-width: 280px;
            --header-height: 72px;
            
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Tajawal', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* Apple Dynamic Mesh Gradient Background */
        body {
            background: radial-gradient(circle at 10% 20%, rgba(220, 230, 255, 0.8) 0%, rgba(242, 242, 247, 0.9) 80%),
                        radial-gradient(circle at 90% 80%, rgba(235, 220, 255, 0.7) 0%, rgba(242, 242, 247, 0.9) 80%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
            font-size: 15px;
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Glassmorphic Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border-left: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            position: fixed;
            height: 100vh;
            transition: var(--transition);
            z-index: 1000;
            right: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 30px 20px 20px;
            text-align: center;
        }

        .sidebar-header .logo i {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--apple-blue), var(--apple-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(88, 86, 214, 0.2));
        }

        .sidebar-header h3 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .sidebar-header p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 3px;
            font-weight: 500;
        }

        .sidebar-menu {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .menu-section-title {
            padding: 8px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-item {
            padding: 10px 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            margin: 4px 0;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .menu-item:hover {
            background: var(--glass-bg-hover);
        }

        .menu-item.active {
            background: var(--apple-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }

        .menu-item i {
            margin-left: 12px;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .menu-item.active i {
            color: white;
        }

        .sidebar-footer {
            padding: 15px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--glass-border-dark);
        }

        /* Glassmorphic Header & Main Area */
        .main-content {
            margin-right: var(--sidebar-width);
            flex: 1;
            transition: var(--transition);
            width: calc(100% - var(--sidebar-width));
        }

        .header {
            height: var(--header-height);
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 30px;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        #current-app-title {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Apple Pill-shaped Buttons */
        .apple-btn {
            background: var(--apple-blue);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }

        .apple-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.35);
        }

        .apple-btn:active {
            transform: scale(0.98);
        }

        .apple-btn i {
            margin-left: 6px;
        }

        .mobile-menu-btn {
            display: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 15px;
            transition: var(--transition);
        }

        /* User Profile Badge */
        .user-profile {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding: 4px 8px;
            border-radius: 30px;
            transition: var(--transition);
        }

        .user-profile:hover {
            background: var(--glass-bg-hover);
        }

        .user-profile .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: 10px;
        }

        .user-profile .user-name {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .user-profile .user-role {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .user-profile img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Glass Dropdown */
        .user-dropdown {
            position: absolute;
            top: 50px;
            left: 0;
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            width: 200px;
            padding: 8px;
            z-index: 1000;
            display: none;
        }

        .user-profile:hover .user-dropdown {
            display: block;
            animation: appleDropdown 0.25s cubic-bezier(0, 0, 0.2, 1);
        }

        .user-dropdown-item {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            transition: var(--transition);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .user-dropdown-item:hover {
            background: var(--apple-blue);
            color: white;
        }

        .user-dropdown-item i {
            margin-left: 10px;
            width: 16px;
        }

        /* Content Area */
        .content-area {
            padding: 30px;
            min-height: calc(100vh - var(--header-height));
        }

        /* Glassmorphic Cards */
        .welcome-message {
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.85), rgba(88, 86, 214, 0.85));
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            color: white;
            padding: 35px;
            border-radius: var(--radius-xl);
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(88, 86, 214, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .welcome-message h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .welcome-message p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 22px;
            border-radius: var(--radius-xl);
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            transition: var(--transition);
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            background: var(--glass-bg-hover);
        }

        .stat-card i {
            font-size: 1.5rem;
            color: var(--apple-blue);
            background: rgba(0, 122, 255, 0.1);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 16px;
        }

        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .stat-card .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Apps Grid */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 22px;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
            background: var(--glass-bg-hover);
        }

        .app-card-icon {
            font-size: 2rem;
            color: var(--apple-blue);
            background: rgba(255, 255, 255, 0.8);
            width: 64px;
            height: 64px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .app-card-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .app-card-actions {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .app-card-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 0.8rem;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-card-actions .launch-btn {
            background: var(--apple-blue);
            color: white;
        }

        .app-card-actions .edit-btn {
            background: rgba(0,0,0,0.05);
            color: var(--text-primary);
        }

        .app-card-actions .delete-btn {
            background: rgba(255, 59, 48, 0.1);
            color: var(--apple-red);
        }

        .app-card-actions button:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }

        /* Apple Glass Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            animation: appleModal 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-weight: 700;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.6);
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            background: white;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        /* Login Screen - Glass Style */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo i {
            font-size: 2.8rem;
            background: linear-gradient(135deg, var(--apple-blue), var(--apple-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .login-box h2 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Keyframes */
        @keyframes appleModal {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes appleDropdown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile & Tablet Optimizations */
        @media (max-width: 1024px) {
            .main-content { margin-right: 0; width: 100%; }
            .sidebar {
                right: -100%;
                border-left: none;
                box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            }
            .sidebar.open { right: 0; }
            .mobile-menu-btn { display: flex; }
        }

        @media (max-width: 576px) {
            .sidebar { width: 80%; }
            .header { padding: 0 16px; }
            .content-area { padding: 16px; }
            .welcome-message { padding: 25px; }
            .welcome-message h2 { font-size: 1.4rem; }
            .stats-container { grid-template-columns: 1fr; }
            .user-info { display: none; }
        }
    </style>
</head>
<body>

<div class="login-container" id="login-container">
    <div class="login-box">
        <div class="login-logo">
            <i class="fas fa-chart-pie"></i>
        </div>
        <h2>تسجيل الدخول</h2>
        <div class="form-group" style="text-align: right;">
            <label for="login-email">البريد الإلكتروني</label>
            <input type="email" id="login-email" placeholder="name@apple.com" required>
        </div>
        <div class="form-group" style="text-align: right;">
            <label for="login-password">كلمة المرور</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button class="apple-btn" id="login-btn" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px; border-radius: var(--radius-md);">
            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
        </button>
        <div id="login-error" style="color: var(--apple-red); margin-top: 15px; display: none; font-size: 0.85rem; font-weight: 500;"></div>
        <div style="margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary);">
            ليس لديك حساب؟ <a href="#" id="register-link" style="color: var(--apple-blue); text-decoration: none; font-weight: 600;">تسجيل جديد</a>
        </div>
    </div>
</div>

<div class="dashboard-container" id="dashboard-container" style="display: none;">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-chart-pie"></i>
            </div>
            <h3>لوحة التحكم الذكية</h3>
            <p>Glassmorphic Edition</p>
        </div>
        <div class="sidebar-menu" id="apps-menu"></div>
        <div class="sidebar-footer">
            <p>&copy; 2026 جميع الحقوق محفوظة</p>
        </div>
    </div>

    <div class="main-content" id="main-content">
        <div class="header">
            <div style="display: flex; align-items: center;">
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <h3 id="current-app-title">الرئيسية</h3>
            </div>
            <div class="header-actions">
                <div class="user-profile">
                    <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=007AFF&color=fff" alt="User">
                    <div class="user-info">
                        <span class="user-name" id="username-display">مستخدم</span>
                        <span class="user-role">مدير النظام</span>
                    </div>
                    <div class="user-dropdown">
                        <a href="#" class="user-dropdown-item"><i class="fas fa-user"></i> الملف الشخصي</a>
                        <a href="#" class="user-dropdown-item"><i class="fas fa-cog"></i> الإعدادات</a>
                        <div style="height: 1px; background: rgba(0,0,0,0.08); margin: 6px 0;"></div>
                        <a href="#" class="user-dropdown-item" id="dropdown-logout-btn" style="color: var(--apple-red);"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
                    </div>
                </div>
                <button class="apple-btn" id="add-app-btn">
                    <i class="fas fa-plus"></i> <span>إضافة تطبيق</span>
                </button>
            </div>
        </div>

        <div class="content-area">
            <div id="welcome-content">
                <div class="welcome-message">
                    <h2 id="welcome-title">مرحباً بك</h2>
                    <p id="welcome-message-text">إليك نظرة عامة على أدواتك وتطبيقاتك اليوم.</p>
                </div>

                <div class="stats-container">
                    <div class="stat-card" id="word-of-day-stat-card">
                        <i class="fas fa-quote-right"></i>
                        <div>
                            <div class="stat-value" id="english-word" style="font-size: 1.2rem;">Loading...</div>
                            <div class="stat-label" id="arabic-meaning"></div>
                        </div>
                    </div>
                    <div class="stat-card" id="apps-count-card">
                        <i class="fas fa-cubes"></i>
                        <div>
                            <div class="stat-value" id="apps-count">0</div>
                            <div class="stat-label">التطبيقات المتاحة</div>
                        </div>
                    </div>
                </div>

                <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-weight: 700; font-size: 1.2rem;">التطبيقات المثبتة</h3>
                </div>

                <div class="apps-grid" id="apps-grid"></div>
            </div>

            <div id="app-frame-container" style="display: none; height: calc(100vh - var(--header-height) - 60px); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);">
                <iframe id="app-viewer" style="width: 100%; height: 100%; border: none;" allow="fullscreen"></iframe>
            </div>
        </div>
    </div>
</div>

<button id="fullscreen-back-btn" style="position: fixed; top: 20px; right: 20px; z-index: 1200; background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: var(--glass-shadow);">
    <i class="fas fa-arrow-left" style="color: var(--text-primary);"></i>
</button>

<!-- Modal -->
<div class="modal" id="app-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">إضافة تطبيق جديد</h3>
            <button class="close-modal" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary);">&times;</button>
        </div>
        <form id="app-form">
            <input type="hidden" id="app-id">
            <div class="form-group">
                <label for="app-name">اسم التطبيق</label>
                <input type="text" id="app-name" required placeholder="مثال: التقويم">
            </div>
            <div class="form-group">
                <label for="app-url">رابط التطبيق</label>
                <input type="url" id="app-url" required placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="app-icon">أيقونة التطبيق</label>
                <select id="app-icon" required>
                    <option value="">اختر أيقونة</option>
                    <option value="fas fa-home">منزل</option>
                    <option value="fas fa-chart-line">رسوم بيانية</option>
                    <option value="fas fa-cog">إعدادات</option>
                    <option value="fas fa-envelope">بريد</option>
                    <option value="fas fa-calendar">تقويم</option>
                    <option value="fas fa-tasks">مهام</option>
                    <option value="fas fa-globe">موقع</option>
                </select>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
                <button type="button" class="close-modal" id="cancel-btn" style="background: rgba(0,0,0,0.05); border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer;">إلغاء</button>
                <button type="submit" class="apple-btn" style="border-radius: var(--radius-md);"><i class="fas fa-save"></i> حفظ</button>
            </div>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyA6I_JWRJ1Xaw3UENFFR3pDfFCFFiy0Btc",
        authDomain: "dashboard-a5cac.firebaseapp.com",
        projectId: "dashboard-a5cac",
        storageBucket: "dashboard-a5cac.appspot.com",
        messagingSenderId: "392696467337",
        appId: "1:392696467337:web:d23d4526db6463dd68db58",
        measurementId: "G-M3Y808XBW3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    document.addEventListener('DOMContentLoaded', function() {
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        const dropdownLogoutBtn = document.getElementById('dropdown-logout-btn');
        const usernameDisplay = document.getElementById('username-display');
        const welcomeTitle = document.getElementById('welcome-title');
        const userAvatar = document.getElementById('user-avatar');
        const sidebar = document.getElementById('sidebar');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const appsMenu = document.getElementById('apps-menu');
        const appViewer = document.getElementById('app-viewer');
        const appFrameContainer = document.getElementById('app-frame-container');
        const welcomeContent = document.getElementById('welcome-content');
        const currentAppTitle = document.getElementById('current-app-title');
        const addAppBtn = document.getElementById('add-app-btn');
        const appsCount = document.getElementById('apps-count');
        const appsGrid = document.getElementById('apps-grid');
        const appModal = document.getElementById('app-modal');
        const appForm = document.getElementById('app-form');
        const appIdInput = document.getElementById('app-id');
        const appNameInput = document.getElementById('app-name');
        const appUrlInput = document.getElementById('app-url');
        const appIconSelect = document.getElementById('app-icon');
        const fullscreenBackBtn = document.getElementById('fullscreen-back-btn');

        let currentUser = null;
        let apps = [];
        let currentAppId = 'welcome';
        let isEditing = false;

        function init() {
            loginBtn.addEventListener('click', loginUser);
            dropdownLogoutBtn.addEventListener('click', logoutUser);
            addAppBtn.addEventListener('click', openAddModal);
            mobileMenuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
            appForm.addEventListener('submit', saveApp);
            fullscreenBackBtn.addEventListener('click', goToHome);
            
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', () => appModal.style.display = 'none');
            });

            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    showDashboard();
                    loadUserApps();
                } else {
                    showLogin();
                }
            });
        }

        function loginUser() {
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();
            if (!email || !password) return showLoginError('الرجاء إدخال البيانات المطلوبة');
            
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => showLoginError('فشل تسجيل الدخول: ' + err.message));
        }

        function showLoginError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        function logoutUser(e) {
            if(e) e.preventDefault();
            auth.signOut();
        }

        function showLogin() {
            loginContainer.style.display = 'flex';
            dashboardContainer.style.display = 'none';
        }

        function showDashboard() {
            loginContainer.style.display = 'none';
            dashboardContainer.style.display = 'flex';
            const username = currentUser.email.split('@')[0];
            usernameDisplay.textContent = username;
            welcomeTitle.textContent = `مرحباً بك، ${username}`;
            userAvatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=007AFF&color=fff`;
        }

        function loadUserApps() {
            database.ref(`users/${currentUser.uid}/apps`).on('value', (snapshot) => {
                apps = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => apps.push({ id: key, ...data[key] }));
                }
                apps.unshift({ id: 'welcome', name: 'الرئيسية', icon: 'fas fa-home', isDefault: true });
                renderAppsMenu();
                renderAppsGrid();
                updateAppsCount();
            });
        }

        function renderAppsMenu() {
            appsMenu.innerHTML = '<div class="menu-section-title">القائمة العامة</div>';
            apps.forEach(app => {
                const item = document.createElement('div');
                item.className = `menu-item ${app.id === currentAppId ? 'active' : ''}`;
                item.innerHTML = `<i class="${app.icon}"></i><span>${app.name}</span>`;
                item.addEventListener('click', () => launchApp(app.id));
                appsMenu.appendChild(item);
            });
        }

        function renderAppsGrid() {
            appsGrid.innerHTML = '';
            const userApps = apps.filter(a => !a.isDefault);
            userApps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-card-icon"><i class="${app.icon}"></i></div>
                    <div class="app-card-name">${app.name}</div>
                    <div class="app-card-actions">
                        <button class="launch-btn" onclick="launchApp('${app.id}')">تشغيل</button>
                        <button class="edit-btn" onclick="openEditModal('${app.id}')"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn" onclick="deleteApp('${app.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                appsGrid.appendChild(card);
            });
        }

        window.launchApp = function(appId) {
            currentAppId = appId;
            const currentApp = apps.find(a => a.id === appId);
            if (!currentApp) return;

            if (appId === 'welcome') {
                welcomeContent.style.display = 'block';
                appFrameContainer.style.display = 'none';
                fullscreenBackBtn.style.display = 'none';
                currentAppTitle.textContent = 'الرئيسية';
            } else {
                welcomeContent.style.display = 'none';
                appFrameContainer.style.display = 'block';
                fullscreenBackBtn.style.display = 'flex';
                appViewer.src = currentApp.url;
                currentAppTitle.textContent = currentApp.name;
            }
            renderAppsMenu();
            sidebar.classList.remove('open');
        };

        function goToHome() {
            launchApp('welcome');
        }

        function updateAppsCount() {
            appsCount.textContent = apps.filter(a => !a.isDefault).length;
        }

        function openAddModal() {
            isEditing = false;
            appForm.reset();
            appModal.style.display = 'flex';
        }

        window.openEditModal = function(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;
            isEditing = true;
            appIdInput.value = app.id;
            appNameInput.value = app.name;
            appUrlInput.value = app.url;
            appIconSelect.value = app.icon;
            appModal.style.display = 'flex';
        };

        function saveApp(e) {
            e.preventDefault();
            const data = {
                name: appNameInput.value.trim(),
                url: appUrlInput.value.trim(),
                icon: appIconSelect.value
            };
            const path = `users/${currentUser.uid}/apps`;
            
            if (isEditing) {
                database.ref(`${path}/${appIdInput.value}`).update(data);
            } else {
                database.ref(path).push(data);
            }
            appModal.style.display = 'none';
        }

        window.deleteApp = function(appId) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                database.ref(`users/${currentUser.uid}/apps/${appId}`).remove();
            }
        };

        init();
    });
</script>
</body>
</html>
